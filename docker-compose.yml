services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      TZ: ${DEFAULT_TIMEZONE:-Europe/Kyiv}
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  bot-data:
